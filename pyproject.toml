[project]
name = "memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask==2.3.2",
    "flask-cors==4.0.0",
    "werkzeug==2.3.7",
    "openai==1.3.0",
    "httpx==0.27.2",
    "requests==2.31.0",
    "python-dotenv>=1.0.1",
    "chromadb==1.5.5",
    "pymilvus[milvus-lite]==3.0.0",
    "milvus-lite==3.0; sys_platform == 'win32'",
    "setuptools>=82.0.1",
    "openpyxl>=3.1.5",
    "matplotlib>=3.9,<3.11",
    "dashscope>=1.25.22",
    "flask-sock>=0.7.0",
    "kmodes>=0.12.2",
    "numpy>=1.26.4,<2",
    "scikit-learn>=1.5,<1.6",
    "scipy>=1.13,<1.14",
    "pandas>=2.2.3,<3",
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.30,<1",
    "pyarrow>=18,<20",
]

[dependency-groups]
dev = [
    "setuptools>=82.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
