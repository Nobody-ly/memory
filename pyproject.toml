[project]
name = "memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask==2.3.2",
    "flask-cors==4.0.0",
    "werkzeug==2.3.7",
    "openai==1.3.0",
    "httpx==0.27.2",
    "requests==2.31.0",
    "python-dotenv>=1.0.1",
    "chromadb==1.5.5",
    "pymilvus[milvus-lite]==3.0.0",
    "milvus-lite==3.0; sys_platform == 'win32'",
    "setuptools>=82.0.1",
    "openpyxl>=3.1.5",
    "matplotlib>=3.10.9",
    "dashscope>=1.25.22",
    "flask-sock>=0.7.0",
]

[project.optional-dependencies]
realtalk-eval = [
    "torch>=2.5,<3",
    "transformers>=4.48,<5",
]

[dependency-groups]
dev = [
    "setuptools>=82.0.1",
]
